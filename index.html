<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JHONEFLIX - Assinatura Emby</title>
    <style>
        body { background-color: #141414; color: #fff; font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        .container { max-width: 400px; margin: 0 auto; background: #1f1f1f; padding: 30px; border-radius: 8px; }
        button { background: #e50914; color: white; border: none; padding: 15px 20px; font-size: 16px; cursor: pointer; border-radius: 4px; width: 100%; margin-top: 20px; }
        button:hover { background: #b20710; }
    </style>
</head>
<body>
    <div class="container">
        <h1>JHONEFLIX</h1>
        <p>Acesso completo ao Emby por 30 dias</p>
        <h2>R$ 20,00</h2>
        <input type="text" id="username" placeholder="Escolha seu usuário do Emby" style="width: 100%; padding: 10px; margin-top: 15px; box-sizing: border-box;">
        <input type="email" id="email" placeholder="Seu e-mail" style="width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box;">
        <button onclick="gerarPix()">Pagar com Pix</button>
    </div>

    <script>
        function gerarPix() {
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            if(!username || !email) {
                alert('Preencha todos os campos!');
                return;
            }
            alert('Integração com gateway de pagamento necessária para gerar o Pix.');
        }
    </script>
</body>
</html>
