
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JHONEFLIX</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #10091c, #32104e, #1a0d2b);
    }
    .logo {
      width: 190px;
      max-width: 80%;
      object-fit: contain;
      margin-bottom: 24px;
    }
    .card {
      width: 100%;
      max-width: 370px;
      padding: 28px;
      border: 1px solid #7542a1;
      border-radius: 18px;
      background: rgba(17, 10, 29, .94);
      box-shadow: 0 12px 40px #0006;
    }
    h1 { text-align: center; color: #d6a5ff; }
    p { text-align: center; color: #d5c9e3; }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 16px;
    }
    input {
      color: white;
      background: #21152e;
      border: 1px solid #674483;
    }
    button {
      border: 0;
      color: white;
      background: #813bd0;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #mensagem { min-height: 24px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <img class="logo" src="logo.png" alt="JHONEFLIX">

  <main class="card">
    <h1>JHONEFLIX</h1>
    <p>Entre com sua conta Emby</p>

    <form id="formLogin">
      <input
        id="username"
        name="username"
        placeholder="Usuário Emby"
        autocomplete="username"
        required
        maxlength="100"
      >
      <input
        id="password"
        name="password"
        type="password"
        placeholder="Senha Emby"
        autocomplete="current-password"
        required
        maxlength="200"
      >
      <button id="entrar" type="submit">Entrar</button>
    </form>

    <p id="mensagem" role="status" aria-live="polite"></p>
  </main>

  <script>
    const form = document.getElementById("formLogin");
    const mensagem = document.getElementById("mensagem");
    const botao = document.getElementById("entrar");

    form.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      botao.disabled = true;
      mensagem.textContent = "Verificando login...";

      try {
        const resposta = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value
          })
        });

        const dados = await resposta.json();
        mensagem.textContent = dados.mensagem ||
          "Não foi possível concluir o login.";

        if (dados.autenticado) {
          form.reset();
        }
      } catch {
        mensagem.textContent = "Não foi possível acessar o servidor.";
      } finally {
        botao.disabled = false;
      }
    });
  </script>
</body>
</html>
